name: softball_world_lineup
description: "Plataforma Oficial de Softball - Softball World Lineup"
publish_to: 'none'
version: 5.7.0+2

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.0
  pdf: 3.11.3
  share_plus: 12.0.1
  path_provider: 2.1.5

dev_dependencies:
  http: ^1.5.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/swl-logo.webp
    - android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
