name: Compilar APK Android - Softball World Lineup

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar estructura Android y dar permiso de Internet
        run: |
          flutter create --org com.softballworld.lineup --project-name softball_world_lineup .
          
          # 1. DAR PERMISO DE INTERNET EN ANDROID
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"\/>' android/app/src/main/AndroidManifest.xml

          # 2. CONFIGURAR SDK MODERNO
          if [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle || true
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true
          fi

          # 3. DESCARGAR TU LOGO OFICIAL COMO ÍCONO DE LA APP
          curl -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png "https://epqyabaegmyjtwqezvbc.supabase.co/storage/v1/object/public/team-logos/logo_transparent-removebg-preview.png" || true
          curl -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png "https://epqyabaegmyjtwqezvbc.supabase.co/storage/v1/object/public/team-logos/logo_transparent-removebg-preview.png" || true
          curl -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png "https://epqyabaegmyjtwqezvbc.supabase.co/storage/v1/object/public/team-logos/logo_transparent-removebg-preview.png" || true
          curl -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png "https://epqyabaegmyjtwqezvbc.supabase.co/storage/v1/object/public/team-logos/logo_transparent-removebg-preview.png" || true
          curl -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "https://epqyabaegmyjtwqezvbc.supabase.co/storage/v1/object/public/team-logos/logo_transparent-removebg-preview.png" || true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK Oficial para Celular
        run: flutter build apk --release

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          name: Softball-World-Lineup-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
