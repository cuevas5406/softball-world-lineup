name: Compilar APK Android - Softball World Lineup

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile

      - name: Analizar y probar
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test
          flutter test --no-pub
          python3 -m unittest discover -s test -p test_v56_proposal_contracts.py

      - name: Compilar APK Oficial
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SWL_LAB_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_ANON_KEY" || {
            echo "ERROR: Falta SWL_LAB_PUBLISHABLE_KEY"
            exit 1
          }

          chmod +x android/gradlew
          flutter build apk --no-pub --release \
            --dart-define=SUPABASE_URL=https://wgeziptdoabyicufnrfk.supabase.co \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Guardar instalador APK
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Softball-World-Lineup-Instalador
          path: build/app/outputs/flutter-apk/app-release.apk
