name: SWL V5.7 - APK de pruebas

# Ejecutar manualmente o marcar el commit consolidado con [apk-v57].
on:
  workflow_dispatch:
  push:
    branches: [pruebas-de-V5.7]

permissions:
  contents: read

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk-v57]')
    name: Compilar APK de prueba
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          java -version

      - name: Resolver dependencias
        run: flutter pub get

      - name: Analizar Flutter
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib test

      # Evitar publicar APK si fallan las reglas locales del partido,
      # alineaciones o las pruebas de regresion existentes.
      - name: Ejecutar pruebas Flutter antes de compilar
        run: flutter test --reporter expanded

      # Validar contratos de integración y propuestas SQL contra el código.
      # Estas pruebas son estáticas: NO ejecutan SQL ni modifican Supabase.
      - name: Verificar contratos V5.7 (Python)
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      # La clave publishable es publica por diseno; nunca usar service_role.
      - name: Compilar APK debug instalable con LAB
        run: |
          chmod +x android/gradlew
          flutter build apk --no-pub --debug \
            --dart-define=SUPABASE_URL=https://wgeziptdoabyicufnrfk.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_abewrhe85_YSfd8ZCl_Ktg_6mrwD4DA

      - name: Publicar APK de prueba
        uses: actions/upload-artifact@v4
        with:
          name: SWL-V5.7-APK-pruebas
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
