name: SWL V5.7 - Solo pruebas (sin APK)

# Ejecutar manualmente las pruebas sin compilar ni publicar instaladores.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Flutter y contratos Python
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Instalar Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolver dependencias
        run: flutter pub get
      - name: Pruebas Flutter
        run: flutter test --reporter expanded
      - name: Contratos V5.7 (sin SQL)
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
